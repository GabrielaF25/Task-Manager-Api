services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"

    ports:
      - "1433:1433"

    volumes:
      - taskmanager-sql-data:/var/opt/mssql


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taskmanager-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagerDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True"

    depends_on:
      - sqlserver


volumes:
  taskmanager-sql-data: